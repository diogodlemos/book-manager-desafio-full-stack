spring.application.name=bookmanager
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bookmanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Teste123**}

spring.jpa.open-in-view=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:minha-secreta-para-o-desafio-book-manager}

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

server.port=${PORT:8080}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
